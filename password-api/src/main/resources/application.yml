spring:
  application:
    name: password
  datasource:
    url: jdbc:mysql://localhost:3306/password?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Seoul
    username: password
    password: password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: false

decorator:
  datasource:
    p6spy:
      enable-logging: true
      log-format: "%(executionTime)ms | %(sql)"
