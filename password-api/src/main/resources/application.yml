server:
  port: ${PORT:8080}

spring:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true
  application:
    name: password
  profiles:
    default: local
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        show_sql: false
