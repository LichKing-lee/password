spring:
  datasource:
    url: jdbc:h2:mem:test
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        show_sql: false

decorator:
  datasource:
    p6spy:
      enable-logging: true
      log-format: "%(executionTime)ms | %(sql)"
